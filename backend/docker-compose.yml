services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: poshan_api
      POSTGRES_USER: poshan
      POSTGRES_PASSWORD: poshan
    ports:
      - "5433:5432" # host 5433 so it doesn't clash with a local Postgres on 5432
    volumes:
      - poshan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poshan -d poshan_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # These three override whatever's in .env — inside compose, the DB is
      # always reachable at the "db" service name, never localhost.
      DB_URL: jdbc:postgresql://db:5432/poshan_api
      DB_USERNAME: poshan
      DB_PASSWORD: poshan
    depends_on:
      db:
        condition: service_healthy

volumes:
  poshan_pgdata:
