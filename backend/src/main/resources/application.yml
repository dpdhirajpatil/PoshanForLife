spring:
  application:
    name: poshan-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Cover-image uploads — keep in sync with SupabaseStorageService.MAX_IMAGE_BYTES
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # HS256 key material; must be at least 256 bits (32 bytes)
    secret: ${JWT_SECRET}
    # Short-lived access token (default 15 min)
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    # Refresh token lifetime (default 14 days)
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:1209600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  supabase:
    storage-url: ${SUPABASE_STORAGE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:covers}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
