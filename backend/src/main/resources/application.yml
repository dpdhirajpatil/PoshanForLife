spring:
  application:
    name: poshan-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # One-time only — set via env vars, NOT hardcoded here, when first
    # connecting to a database where V1-V16 were applied by hand:
    #   SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
    #   SPRING_FLYWAY_BASELINE_VERSION=16
    # Remove both env vars after the first successful startup against
    # that database — they should never be a permanent setting.
  servlet:
    multipart:
      # Ceiling across all uploads; per-type checks are stricter (cover images:
      # SupabaseStorageService.MAX_IMAGE_BYTES = 5MB, report PDFs: 10MB).
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # HS256 key material; must be at least 256 bits (32 bytes)
    secret: ${JWT_SECRET}
    # Short-lived access token (default 15 min)
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    # Refresh token lifetime (default 14 days)
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:1209600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  supabase:
    storage-url: ${SUPABASE_STORAGE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:covers}
    # Private bucket for report/InBody PDFs — never made public; served via signed URLs.
    reports-bucket: ${SUPABASE_REPORTS_BUCKET:poshan-reports}
    # Private bucket for generated estimate/invoice PDFs — served via signed URLs
    # (longer TTL than reports, since these get shared onward over WhatsApp).
    documents-bucket: ${SUPABASE_DOCUMENTS_BUCKET:poshan-documents}
  firebase:
    # Path to the Firebase service account JSON on disk. Never commit the file
    # itself; point this at a path injected by the deploy environment, or leave
    # it blank and set credentials-base64 instead (e.g. for platforms without
    # persistent disk — the value is decoded in-memory, never written to disk).
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  msg91:
    # Transactional SMS for phone-number (OTP) login/signup. The auth key is a
    # secret — env only, never committed. template-id and sender-id must both
    # be DLT-approved through MSG91 before real sends work in India; until then
    # the local/dev profiles accept a fixed code instead (see PhoneOtpService).
    auth-key: ${MSG91_AUTH_KEY:}
    template-id: ${MSG91_TEMPLATE_ID:}
    sender-id: ${MSG91_SENDER_ID:}
    base-url: ${MSG91_BASE_URL:}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    # Configurable, not hardcoded in AnthropicExtractionService — override via
    # app.anthropic.prompt-template (or APP_ANTHROPIC_PROMPT_TEMPLATE) to tune
    # the extraction without a code change.
    prompt-template: |
      You are extracting structured body-composition data from an InBody
      report. Read the provided report content (text or image) and return
      ONLY a single JSON object - no markdown fences, no commentary - with
      exactly these keys (use JSON null, not a guess, for any value not
      present in the report):
      weightKg, bodyFatPercent, skeletalMuscleMassKg, bmi, visceralFatLevel,
      bodyWaterL, proteinKg, mineralKg, basalMetabolicRate, bodyFatMassKg,
      fatFreeMassKg, waistHipRatio, targetWeightKg, weightControlKg,
      fatControlKg, muscleControlKg, obesityDegreePercent,
      intracellularWaterL, extracellularWaterL, inbodyScore.
      All values are plain numbers in the units InBody normally reports them
      in (kg, percent, liters, kcal) except inbodyScore which is an integer
      0-100. Do not invent a value you cannot find in the report.
