# Local development — safe defaults so the app starts with zero env vars.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poshan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.poshanforlife.api: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    # Local-only default; never reuse outside local dev.
    secret: ${JWT_SECRET:local-dev-only-secret-key-poshan-for-life-0123456789abcdef}
