# Local development — safe defaults so the app starts with zero env vars.
spring:
  datasource:
    # Dedicated DB for this rebuild — the plain `poshan` DB holds the
    # original Next.js app's Prisma schema; don't point Flyway at it.
    # This machine's local Postgres (Homebrew) has no "postgres" role — it
    # uses the OS user (dhiraj) with trust auth, so that's the real default.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poshan_api}
    username: ${DB_USERNAME:dhiraj}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.poshanforlife.api: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    # Local-only default; never reuse outside local dev.
    secret: ${JWT_SECRET:local-dev-only-secret-key-poshan-for-life-0123456789abcdef}
