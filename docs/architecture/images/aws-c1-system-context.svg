<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" style="color:#1b2330" viewBox="0 0 1160 520" role="img" aria-label="C1: the developer provisions the AWS platform with Terraform, starts and stops it, and pushes code to GitHub; GitHub deploys to the platform through OIDC; app users call the platform's API over HTTP; the platform uses Supabase for Postgres and storage, and Firebase, MSG91 and Anthropic over HTTPS.">
<style>
