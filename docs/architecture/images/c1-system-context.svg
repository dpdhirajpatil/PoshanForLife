<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" style="color:#1b2330" viewBox="0 0 1160 540" role="img" aria-label="C1 system context: admins use the platform on the web, doctors on the web and mobile, patients and leads on mobile; the platform sends push through Firebase Cloud Messaging, SMS codes through MSG91, reads report metrics through the Anthropic API, and the mobile apps read health data from Health Connect and HealthKit on the device.">
<style>
text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
text { fill: #1b2330; font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.bt { font-weight: 600; font-size: 13.5px; }
.sub { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.lbl { fill: #5a6575; font-size: 11.5px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.lbl.acc { fill: #2c5aa0; }
.lbl.warn { fill: #9a6200; }
.lbl.bad { fill: #b03a3a; }
.zl { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; letter-spacing: 0.04em; }
.box { fill: #ffffff; stroke: #c6cfdb; stroke-width: 1.3; }
.box-acc { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.box-ok { fill: #e1f2e7; stroke: #2b7a4b; stroke-width: 1.3; }
.box-warn { fill: #f8edd8; stroke: #9a6200; stroke-width: 1.3; }
.box-ghost { fill: none; stroke: #5a6575; stroke-width: 1.2; stroke-dasharray: 5 4; }
.zone-aws { fill: #edf2f9; stroke: #c6cfdb; }
.zone-sb { fill: #eef5f0; stroke: #c6cfdb; }
.frame { fill: none; stroke: #5a6575; stroke-dasharray: 6 4; stroke-width: 1.1; }
.e { fill: none; stroke: #1b2330; stroke-width: 1.5; }
.e-acc { fill: none; stroke: #2c5aa0; stroke-width: 1.7; }
.e-warn { fill: none; stroke: #9a6200; stroke-width: 1.5; stroke-dasharray: 5 3; }
.e-prov { fill: none; stroke: #5a6575; stroke-width: 1.6; stroke-dasharray: 2 3; }
.e-bad { fill: none; stroke: #b03a3a; stroke-width: 1.5; stroke-dasharray: 5 3; }
.ret { stroke-dasharray: 5 4; }
.life { stroke: #c6cfdb; stroke-width: 1.2; stroke-dasharray: 4 4; }
.mk { fill: #1b2330; }
.mk-acc { fill: #2c5aa0; }
.mk-warn { fill: #9a6200; }
.mk-prov { fill: #5a6575; }
.mk-bad { fill: #b03a3a; }
.axis { stroke: #5a6575; stroke-width: 1.2; }
.band { fill: #f8edd8; stroke: #9a6200; stroke-width: 1; }
.dot { fill: #ffffff; stroke: #1b2330; stroke-width: 1.5; }
.dot-acc { fill: #2c5aa0; stroke: #2c5aa0; }
.bracket { fill: none; stroke: #2b7a4b; stroke-width: 1.5; }
.person { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.5; }
.sys { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 2.4; }
.comp { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.ext { fill: #eef5f0; stroke: #5a6575; stroke-width: 1.2; }
.ext-g { fill: #f3f5f8; stroke: #5a6575; stroke-width: 1.2; }
.bnd { fill: none; stroke: #2c5aa0; stroke-width: 1.4; stroke-dasharray: 8 5; }
.node { fill: none; stroke: #5a6575; stroke-width: 1.3; }
.node-f { fill: #edf2f9; stroke: #5a6575; stroke-width: 1.3; }
.cls { fill: #ffffff; stroke: #1b2330; stroke-width: 1.2; }
.cls-e { fill: #eef5f0; stroke: #1b2330; stroke-width: 1.2; }
.sep { stroke: #c6cfdb; stroke-width: 1.2; }
.st { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.m { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; fill: #1b2330; }
.bus { stroke: #5a6575; stroke-width: 1.4; fill: none; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
        <defs>
          <marker id="x1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
        </defs>
        <!-- people -->
        <circle class="person" cx="160" cy="34" r="16"/>
        <rect class="person" x="60" y="52" width="200" height="66" rx="16"/>
        <text class="bt" x="160" y="76" text-anchor="middle">Admin</text>
        <text class="sub" x="160" y="94" text-anchor="middle">[Person] runs the clinic:</text>
        <text class="sub" x="160" y="108" text-anchor="middle">users, catalogue, badges</text>
        <circle class="person" cx="420" cy="34" r="16"/>
        <rect class="person" x="320" y="52" width="200" height="66" rx="16"/>
        <text class="bt" x="420" y="76" text-anchor="middle">Doctor</text>
        <text class="sub" x="420" y="94" text-anchor="middle">[Person] patients, reports,</text>
        <text class="sub" x="420" y="108" text-anchor="middle">orders, invoices</text>
        <circle class="person" cx="740" cy="34" r="16"/>
        <rect class="person" x="640" y="52" width="200" height="66" rx="16"/>
        <text class="bt" x="740" y="76" text-anchor="middle">Patient</text>
        <text class="sub" x="740" y="94" text-anchor="middle">[Person] tracks health,</text>
        <text class="sub" x="740" y="108" text-anchor="middle">programmes, appointments</text>
        <circle class="person" cx="1000" cy="34" r="16"/>
        <rect class="person" x="900" y="52" width="200" height="66" rx="16"/>
        <text class="bt" x="1000" y="76" text-anchor="middle">Lead</text>
        <text class="sub" x="1000" y="94" text-anchor="middle">[Person] prospect: signs up,</text>
        <text class="sub" x="1000" y="108" text-anchor="middle">requests a consultation</text>

        <!-- system -->
        <rect class="sys" x="330" y="210" width="500" height="120" rx="12"/>
        <text class="bt" x="580" y="244" text-anchor="middle" style="font-size:17px">Poshan for Life</text>
        <text class="sub" x="580" y="264" text-anchor="middle">[Software system]</text>
        <text class="sub" x="580" y="286" text-anchor="middle">Staff web portal, patient &amp; doctor mobile apps,</text>
        <text class="sub" x="580" y="302" text-anchor="middle">and the API and data behind them</text>

        <line class="e" x1="160" y1="118" x2="400" y2="207" marker-end="url(#x1)"/>
        <text class="lbl" x="268" y="156" text-anchor="middle">web</text>
        <line class="e" x1="420" y1="118" x2="490" y2="207" marker-end="url(#x1)"/>
        <text class="lbl" x="470" y="160" text-anchor="middle">web · mobile</text>
        <line class="e" x1="740" y1="118" x2="670" y2="207" marker-end="url(#x1)"/>
        <text class="lbl" x="690" y="160" text-anchor="middle">mobile</text>
        <line class="e" x1="1000" y1="118" x2="760" y2="207" marker-end="url(#x1)"/>
        <text class="lbl" x="892" y="156" text-anchor="middle">mobile</text>

        <!-- externals -->
        <rect class="ext" x="20" y="428" width="255" height="88" rx="10"/>
        <text class="bt" x="147" y="456" text-anchor="middle">Health Connect · HealthKit</text>
        <text class="sub" x="147" y="476" text-anchor="middle">[External system, on device]</text>
        <text class="sub" x="147" y="494" text-anchor="middle">steps, sleep, heart rate, weight</text>
        <rect class="ext" x="295" y="428" width="255" height="88" rx="10"/>
        <text class="bt" x="422" y="456" text-anchor="middle">Firebase Cloud Messaging</text>
        <text class="sub" x="422" y="476" text-anchor="middle">[External system]</text>
        <text class="sub" x="422" y="494" text-anchor="middle">delivers push to phones</text>
        <rect class="ext" x="570" y="428" width="255" height="88" rx="10"/>
        <text class="bt" x="697" y="456" text-anchor="middle">MSG91</text>
        <text class="sub" x="697" y="476" text-anchor="middle">[External system]</text>
        <text class="sub" x="697" y="494" text-anchor="middle">SMS one-time login codes</text>
        <rect class="ext" x="845" y="428" width="255" height="88" rx="10"/>
        <text class="bt" x="972" y="456" text-anchor="middle">Anthropic API</text>
        <text class="sub" x="972" y="476" text-anchor="middle">[External system]</text>
        <text class="sub" x="972" y="494" text-anchor="middle">reads InBody reports → metrics</text>

        <line class="e" x1="147" y1="428" x2="390" y2="333" marker-end="url(#x1)"/>
        <text class="lbl" x="250" y="372" text-anchor="middle">health data</text>
        <line class="e" x1="500" y1="330" x2="440" y2="425" marker-end="url(#x1)"/>
        <text class="lbl" x="480" y="385" text-anchor="middle">push</text>
        <line class="e" x1="650" y1="330" x2="690" y2="425" marker-end="url(#x1)"/>
        <text class="lbl" x="688" y="380">OTP SMS</text>
        <line class="e" x1="790" y1="330" x2="940" y2="425" marker-end="url(#x1)"/>
        <text class="lbl" x="880" y="370">report extraction</text>
      </svg>
