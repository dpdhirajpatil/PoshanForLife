<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="625" style="color:#1b2330" viewBox="0 0 1160 625" role="img" aria-label="C3 component diagram of the Spring Boot API container: requests from web and mobile clients pass the security filter chain and rate limiter, then reach five controller groups, which call five service groups; services persist through Spring Data JPA to Postgres and call MSG91, Anthropic, Supabase Storage and Firebase; a global exception handler turns errors into the error envelope; Flyway migrates the schema at startup.">
<style>
text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
text { fill: #1b2330; font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.bt { font-weight: 600; font-size: 13.5px; }
.sub { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.lbl { fill: #5a6575; font-size: 11.5px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.lbl.acc { fill: #2c5aa0; }
.lbl.warn { fill: #9a6200; }
.lbl.bad { fill: #b03a3a; }
.zl { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; letter-spacing: 0.04em; }
.box { fill: #ffffff; stroke: #c6cfdb; stroke-width: 1.3; }
