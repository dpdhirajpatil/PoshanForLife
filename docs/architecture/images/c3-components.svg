        <rect class="comp" x="265" y="372" width="165" height="96" rx="8"/>
        <text class="bt" x="347" y="398" text-anchor="middle">Identity &amp; OTP</text>
        <text class="sub" x="347" y="418" text-anchor="middle">AuthService · UserService</text>
        <text class="sub" x="347" y="434" text-anchor="middle">PhoneOtpService</text>
        <text class="sub" x="347" y="450" text-anchor="middle">JwtService · OtpSmsClient</text>
        <rect class="comp" x="445" y="372" width="165" height="96" rx="8"/>
        <text class="bt" x="527" y="398" text-anchor="middle">Clinical services</text>
        <text class="sub" x="527" y="418" text-anchor="middle">PatientService</text>
        <text class="sub" x="527" y="434" text-anchor="middle">AssignmentService</text>
        <text class="sub" x="527" y="450" text-anchor="middle">AppointmentService</text>
        <rect class="comp" x="625" y="372" width="155" height="96" rx="8"/>
        <text class="bt" x="702" y="398" text-anchor="middle">Report processing</text>
        <text class="sub" x="702" y="418" text-anchor="middle">ReportService</text>
        <text class="sub" x="702" y="434" text-anchor="middle">PdfTextExtraction</text>
        <text class="sub" x="702" y="450" text-anchor="middle">AnthropicExtraction</text>
        <rect class="comp" x="795" y="372" width="155" height="96" rx="8"/>
        <text class="bt" x="872" y="398" text-anchor="middle">Commerce services</text>
        <text class="sub" x="872" y="418" text-anchor="middle">Order · Transaction</text>
        <text class="sub" x="872" y="434" text-anchor="middle">DocumentService</text>
        <text class="sub" x="872" y="450" text-anchor="middle">DocumentPdfRenderer</text>
        <rect class="comp" x="965" y="372" width="155" height="96" rx="8"/>
        <text class="bt" x="1042" y="398" text-anchor="middle">Notifications</text>
        <text class="sub" x="1042" y="418" text-anchor="middle">NotificationService</text>
        <text class="sub" x="1042" y="434" text-anchor="middle">FcmPushService @Async</text>
        <text class="sub" x="1042" y="450" text-anchor="middle">Badge · Lead · Streak</text>

        <!-- persistence bus -->
        <line class="bus" x1="255" y1="484" x2="990" y2="484"/>
        <line class="bus" x1="290" y1="468" x2="290" y2="484"/>
        <line class="bus" x1="527" y1="468" x2="527" y2="484"/>
        <line class="bus" x1="700" y1="468" x2="700" y2="484"/>
        <line class="bus" x1="820" y1="468" x2="820" y2="484"/>
        <line class="bus" x1="990" y1="468" x2="990" y2="484"/>
