        <text class="bt" x="527" y="556" text-anchor="middle">Anthropic API</text>
        <text class="sub" x="527" y="574" text-anchor="middle">report text → metrics</text>
        <text class="sub" x="527" y="590" text-anchor="middle">[External · HTTPS]</text>
        <rect class="ext" x="700" y="530" width="190" height="72" rx="8"/>
        <text class="bt" x="795" y="556" text-anchor="middle">Supabase Storage</text>
        <text class="sub" x="795" y="574" text-anchor="middle">images · PDFs · signed URLs</text>
        <text class="sub" x="795" y="590" text-anchor="middle">[External · REST]</text>
        <rect class="ext" x="965" y="530" width="155" height="72" rx="8"/>
        <text class="bt" x="1042" y="556" text-anchor="middle">Firebase FCM</text>
