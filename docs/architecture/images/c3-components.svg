        <rect class="ext" x="40" y="530" width="205" height="72" rx="8"/>
        <text class="bt" x="142" y="556" text-anchor="middle">Postgres 17</text>
        <text class="sub" x="142" y="574" text-anchor="middle">Supabase · pooler :5432</text>
        <text class="sub" x="142" y="590" text-anchor="middle">[Container: database]</text>
