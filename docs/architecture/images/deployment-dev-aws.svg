<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" style="color:#1b2330" viewBox="0 0 1160 640" role="img" aria-label="Deployment: user devices reach the Application Load Balancer on port 80 inside the default VPC in ap-south-1; the balancer forwards to the Spring Boot API container running in Docker on an ECS-optimized t3.micro in an Auto Scaling group of 0 to 1; the container pulls its image from ECR, reads secrets from Secrets Manager, writes logs to CloudWatch, connects to Supabase Postgres through the session pooler and calls Supabase Storage, Firebase, MSG91 and Anthropic over HTTPS; GitHub Actions pushes images to ECR and updates the ECS service.">
<style>
text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
text { fill: #1b2330; font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.bt { font-weight: 600; font-size: 13.5px; }
.sub { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.lbl { fill: #5a6575; font-size: 11.5px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.lbl.acc { fill: #2c5aa0; }
.lbl.warn { fill: #9a6200; }
.lbl.bad { fill: #b03a3a; }
.zl { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; letter-spacing: 0.04em; }
.box { fill: #ffffff; stroke: #c6cfdb; stroke-width: 1.3; }
.box-acc { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.box-ok { fill: #e1f2e7; stroke: #2b7a4b; stroke-width: 1.3; }
.box-warn { fill: #f8edd8; stroke: #9a6200; stroke-width: 1.3; }
.box-ghost { fill: none; stroke: #5a6575; stroke-width: 1.2; stroke-dasharray: 5 4; }
.zone-aws { fill: #edf2f9; stroke: #c6cfdb; }
.zone-sb { fill: #eef5f0; stroke: #c6cfdb; }
.frame { fill: none; stroke: #5a6575; stroke-dasharray: 6 4; stroke-width: 1.1; }
.e { fill: none; stroke: #1b2330; stroke-width: 1.5; }
.e-acc { fill: none; stroke: #2c5aa0; stroke-width: 1.7; }
.e-warn { fill: none; stroke: #9a6200; stroke-width: 1.5; stroke-dasharray: 5 3; }
.e-prov { fill: none; stroke: #5a6575; stroke-width: 1.6; stroke-dasharray: 2 3; }
.e-bad { fill: none; stroke: #b03a3a; stroke-width: 1.5; stroke-dasharray: 5 3; }
.ret { stroke-dasharray: 5 4; }
.life { stroke: #c6cfdb; stroke-width: 1.2; stroke-dasharray: 4 4; }
.mk { fill: #1b2330; }
.mk-acc { fill: #2c5aa0; }
.mk-warn { fill: #9a6200; }
.mk-prov { fill: #5a6575; }
.mk-bad { fill: #b03a3a; }
.axis { stroke: #5a6575; stroke-width: 1.2; }
.band { fill: #f8edd8; stroke: #9a6200; stroke-width: 1; }
.dot { fill: #ffffff; stroke: #1b2330; stroke-width: 1.5; }
.dot-acc { fill: #2c5aa0; stroke: #2c5aa0; }
.bracket { fill: none; stroke: #2b7a4b; stroke-width: 1.5; }
.person { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.5; }
.sys { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 2.4; }
.comp { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.ext { fill: #eef5f0; stroke: #5a6575; stroke-width: 1.2; }
.ext-g { fill: #f3f5f8; stroke: #5a6575; stroke-width: 1.2; }
.bnd { fill: none; stroke: #2c5aa0; stroke-width: 1.4; stroke-dasharray: 8 5; }
.node { fill: none; stroke: #5a6575; stroke-width: 1.3; }
.node-f { fill: #edf2f9; stroke: #5a6575; stroke-width: 1.3; }
.cls { fill: #ffffff; stroke: #1b2330; stroke-width: 1.2; }
.cls-e { fill: #eef5f0; stroke: #1b2330; stroke-width: 1.2; }
.sep { stroke: #c6cfdb; stroke-width: 1.2; }
.st { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.m { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; fill: #1b2330; }
.bus { stroke: #5a6575; stroke-width: 1.4; fill: none; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
        <defs>
          <marker id="d4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
          <marker id="d4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-acc"/></marker>
          <marker id="d4w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-warn"/></marker>
        </defs>
        <!-- devices -->
        <rect class="node" x="20" y="20" width="250" height="118" rx="10"/>
        <text class="zl" x="34" y="40">USER DEVICES</text>
        <text class="m" x="34" y="66">browser · Angular SPA</text>
        <text class="m" x="34" y="84">Android app (Kotlin)</text>
        <text class="m" x="34" y="102">iOS app (Swift)</text>
        <text class="st" x="34" y="124">needs HTTPS: not wired yet</text>

        <!-- github -->
        <rect class="node" x="20" y="180" width="250" height="134" rx="10"/>
        <text class="zl" x="34" y="200">GITHUB ACTIONS</text>
        <text class="st" x="34" y="216">ubuntu-latest runner (amd64)</text>
        <rect class="comp" x="34" y="228" width="222" height="70" rx="6"/>
        <text class="bt" x="145" y="252" text-anchor="middle">backend-deploy-dev</text>
        <text class="sub" x="145" y="270" text-anchor="middle">docker build · OIDC creds</text>
        <text class="sub" x="145" y="286" text-anchor="middle">env: dev · branch develop</text>

        <!-- AWS -->
        <rect class="node-f" x="300" y="20" width="560" height="605" rx="12"/>
        <text class="zl" x="316" y="40">AMAZON WEB SERVICES · ap-south-1 (MUMBAI)</text>
        <rect class="node" x="316" y="54" width="528" height="412" rx="10"/>
        <text class="zl" x="330" y="72">DEFAULT VPC · PUBLIC SUBNETS 1a + 1b</text>
        <rect class="box" x="332" y="84" width="496" height="58" rx="8"/>
        <text class="bt" x="580" y="108" text-anchor="middle">Application Load Balancer</text>
        <text class="sub" x="580" y="126" text-anchor="middle">listener :80 · health /api/v1/health · drain 30 s</text>
        <rect class="node" x="332" y="168" width="496" height="284" rx="10"/>
        <text class="zl" x="346" y="186">AUTO SCALING GROUP · 0..1 (env-power start/stop)</text>
        <rect class="node" x="348" y="198" width="464" height="240" rx="10"/>
        <text class="zl" x="362" y="216">EC2 t3.micro · ECS-OPTIMIZED AMAZON LINUX 2023</text>
        <rect class="node" x="364" y="228" width="432" height="196" rx="10"/>
        <text class="zl" x="378" y="246">DOCKER · ECS AGENT (BRIDGE NETWORK)</text>
        <rect class="comp" x="380" y="260" width="400" height="148" rx="8"/>
        <text class="bt" x="580" y="286" text-anchor="middle">Spring Boot API</text>
        <text class="sub" x="580" y="304" text-anchor="middle">[Container] eclipse-temurin 25 JRE</text>
        <text class="sub" x="580" y="322" text-anchor="middle">image poshan-backend-dev:&lt;git sha&gt;</text>
        <text class="sub" x="580" y="340" text-anchor="middle">700 MB · 512 CPU · heap 75% · profile dev</text>
        <text class="sub" x="580" y="358" text-anchor="middle">container :8080 ← host :32768 (dynamic)</text>
        <text class="sub" x="580" y="376" text-anchor="middle">task def rev 3 · grace 180 s</text>
        <text class="sub" x="580" y="394" text-anchor="middle">stop-then-start deploys (0% / 100%)</text>

        <!-- regional services -->
        <rect class="box" x="316" y="490" width="160" height="72" rx="8"/>
        <text class="bt" x="396" y="516" text-anchor="middle">ECR</text>
        <text class="sub" x="396" y="534" text-anchor="middle">poshan-backend-dev</text>
        <text class="sub" x="396" y="550" text-anchor="middle">last 10 images</text>
        <rect class="box-warn" x="492" y="490" width="176" height="72" rx="8"/>
        <text class="bt" x="580" y="516" text-anchor="middle">Secrets Manager</text>
        <text class="sub" x="580" y="534" text-anchor="middle">poshan-backend-dev/app</text>
        <text class="sub" x="580" y="550" text-anchor="middle">DB_PASSWORD · JWT_SECRET</text>
        <rect class="box" x="684" y="490" width="160" height="72" rx="8"/>
        <text class="bt" x="764" y="516" text-anchor="middle">CloudWatch Logs</text>
        <text class="sub" x="764" y="534" text-anchor="middle">/ecs/poshan-backend-dev</text>
        <text class="sub" x="764" y="550" text-anchor="middle">14-day retention</text>
        <text class="st" x="316" y="590">Provisioned by Terraform (.iac/) · state in S3 poshan-backend-terraform-state</text>
        <text class="st" x="316" y="606">IAM: task execution role · GitHub deploy role (OIDC) · instance role</text>

        <!-- Supabase -->
        <rect class="node" x="890" y="20" width="250" height="262" rx="10"/>
        <text class="zl" x="904" y="40">SUPABASE · ap-south-1</text>
        <rect class="box" x="906" y="54" width="218" height="58" rx="8"/>
        <text class="bt" x="1015" y="78" text-anchor="middle">Session pooler</text>
        <text class="sub" x="1015" y="96" text-anchor="middle">aws-0 · :5432 · IPv4</text>
        <rect class="ext" x="906" y="134" width="218" height="58" rx="8"/>
        <text class="bt" x="1015" y="158" text-anchor="middle">Postgres 17</text>
        <text class="sub" x="1015" y="176" text-anchor="middle">project poshan-dev</text>
        <rect class="ext" x="906" y="208" width="218" height="58" rx="8"/>
        <text class="bt" x="1015" y="232" text-anchor="middle">Storage</text>
        <text class="sub" x="1015" y="250" text-anchor="middle">project poshan-for-life</text>
        <line class="e" x1="1015" y1="112" x2="1015" y2="131" marker-end="url(#d4)"/>

        <!-- SaaS -->
        <rect class="node" x="890" y="312" width="250" height="250" rx="10"/>
        <text class="zl" x="904" y="332">EXTERNAL SAAS</text>
        <rect class="ext" x="906" y="346" width="218" height="58" rx="8"/>
        <text class="bt" x="1015" y="370" text-anchor="middle">Firebase FCM</text>
        <text class="sub" x="1015" y="388" text-anchor="middle">push → Android, iOS</text>
        <rect class="ext" x="906" y="416" width="218" height="58" rx="8"/>
        <text class="bt" x="1015" y="440" text-anchor="middle">MSG91</text>
        <text class="sub" x="1015" y="458" text-anchor="middle">SMS codes</text>
        <rect class="ext" x="906" y="486" width="218" height="58" rx="8"/>
        <text class="bt" x="1015" y="510" text-anchor="middle">Anthropic API</text>
        <text class="sub" x="1015" y="528" text-anchor="middle">report extraction</text>

        <!-- edges -->
        <line class="e" x1="270" y1="90" x2="329" y2="108" marker-end="url(#d4)"/>
        <text class="lbl" x="298" y="86" text-anchor="middle">HTTP :80</text>
        <line class="e" x1="580" y1="142" x2="580" y2="257" marker-end="url(#d4)"/>
        <text class="lbl" x="588" y="162">→ host :32768</text>
        <polyline class="e-acc" points="145,298 145,526 313,526" marker-end="url(#d4a)"/>
        <text class="lbl acc" x="153" y="470">docker push</text>
        <polyline class="e-acc" points="256,240 300,240 300,300 345,300" marker-end="url(#d4a)"/>
        <text class="lbl acc" x="276" y="330">update service</text>
        <line class="e" x1="420" y1="488" x2="440" y2="411" marker-end="url(#d4)"/>
        <text class="lbl" x="388" y="474" text-anchor="end">pull</text>
        <line class="e-warn" x1="580" y1="488" x2="580" y2="411" marker-end="url(#d4w)"/>
        <text class="lbl warn" x="588" y="472">at start</text>
        <line class="e" x1="720" y1="408" x2="750" y2="487" marker-end="url(#d4)"/>
        <text class="lbl" x="742" y="456">awslogs</text>
        <polyline class="e" points="780,290 870,290 870,83 903,83" marker-end="url(#d4)"/>
        <text class="lbl" x="876" y="190">JDBC · TLS</text>
        <polyline class="e" points="780,330 880,330 880,237 903,237" marker-end="url(#d4)"/>
        <polyline class="e" points="780,370 885,370 885,440 903,440" marker-end="url(#d4)"/>
        <text class="lbl" x="826" y="362" text-anchor="middle">HTTPS :443</text>
      </svg>
