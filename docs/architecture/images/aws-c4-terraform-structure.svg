<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" style="color:#1b2330" viewBox="0 0 1160 600" role="img" aria-label="Terraform structure: three root configs: bootstrap with local state creates the S3 state bucket; shared/github-oidc and environments/dev/backend keep their state in that bucket; the dev root calls three modules: networking passes vpc_id and subnet_ids to ecs-ec2-app, whose outputs feed github-deploy-role, which looks up the OIDC provider created by shared/github-oidc.">
<style>
text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
text { fill: #1b2330; font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.bt { font-weight: 600; font-size: 13.5px; }
.sub { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.lbl { fill: #5a6575; font-size: 11.5px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.lbl.acc { fill: #2c5aa0; }
.lbl.warn { fill: #9a6200; }
.lbl.bad { fill: #b03a3a; }
.zl { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; letter-spacing: 0.04em; }
.box { fill: #ffffff; stroke: #c6cfdb; stroke-width: 1.3; }
.box-acc { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.box-ok { fill: #e1f2e7; stroke: #2b7a4b; stroke-width: 1.3; }
.box-warn { fill: #f8edd8; stroke: #9a6200; stroke-width: 1.3; }
.box-ghost { fill: none; stroke: #5a6575; stroke-width: 1.2; stroke-dasharray: 5 4; }
.zone-aws { fill: #edf2f9; stroke: #c6cfdb; }
.zone-sb { fill: #eef5f0; stroke: #c6cfdb; }
.frame { fill: none; stroke: #5a6575; stroke-dasharray: 6 4; stroke-width: 1.1; }
.e { fill: none; stroke: #1b2330; stroke-width: 1.5; }
.e-acc { fill: none; stroke: #2c5aa0; stroke-width: 1.7; }
.e-warn { fill: none; stroke: #9a6200; stroke-width: 1.5; stroke-dasharray: 5 3; }
.e-prov { fill: none; stroke: #5a6575; stroke-width: 1.6; stroke-dasharray: 2 3; }
.e-bad { fill: none; stroke: #b03a3a; stroke-width: 1.5; stroke-dasharray: 5 3; }
.ret { stroke-dasharray: 5 4; }
.life { stroke: #c6cfdb; stroke-width: 1.2; stroke-dasharray: 4 4; }
.mk { fill: #1b2330; }
.mk-acc { fill: #2c5aa0; }
.mk-warn { fill: #9a6200; }
.mk-prov { fill: #5a6575; }
.mk-bad { fill: #b03a3a; }
.axis { stroke: #5a6575; stroke-width: 1.2; }
.band { fill: #f8edd8; stroke: #9a6200; stroke-width: 1; }
.dot { fill: #ffffff; stroke: #1b2330; stroke-width: 1.5; }
.dot-acc { fill: #2c5aa0; stroke: #2c5aa0; }
.bracket { fill: none; stroke: #2b7a4b; stroke-width: 1.5; }
.person { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.5; }
.sys { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 2.4; }
.comp { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.ext { fill: #eef5f0; stroke: #5a6575; stroke-width: 1.2; }
.ext-g { fill: #f3f5f8; stroke: #5a6575; stroke-width: 1.2; }
.bnd { fill: none; stroke: #2c5aa0; stroke-width: 1.4; stroke-dasharray: 8 5; }
.node { fill: none; stroke: #5a6575; stroke-width: 1.3; }
.node-f { fill: #edf2f9; stroke: #5a6575; stroke-width: 1.3; }
.cls { fill: #ffffff; stroke: #1b2330; stroke-width: 1.2; }
.cls-e { fill: #eef5f0; stroke: #1b2330; stroke-width: 1.2; }
.sep { stroke: #c6cfdb; stroke-width: 1.2; }
.st { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.m { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; fill: #1b2330; }
.bus { stroke: #5a6575; stroke-width: 1.4; fill: none; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
        <defs>
          <marker id="a4m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
          <marker id="a4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-prov"/></marker>
        </defs>
        <!-- bootstrap -->
        <rect class="cls" x="20" y="20" width="310" height="170" rx="4"/>
        <text class="bt" x="175" y="40" text-anchor="middle">bootstrap/</text>
        <text class="st" x="175" y="56" text-anchor="middle">«root config» state: local file</text>
        <line class="sep" x1="20" y1="64" x2="330" y2="64"/>
        <text class="m" x="30" y="82">aws_s3_bucket.terraform_state</text>
        <text class="m" x="30" y="98">  + versioning · SSE · public block</text>
        <text class="m" x="30" y="114">aws_s3_object.environment_folder[4]</text>
        <line class="sep" x1="20" y1="124" x2="330" y2="124"/>
        <text class="m" x="30" y="142">var state_bucket_name</text>
        <text class="m" x="30" y="158">var environments [local dev qa prod]</text>
        <text class="m" x="30" y="174">var allowed_account_ids</text>

        <!-- shared oidc -->
        <rect class="cls" x="20" y="230" width="310" height="130" rx="4"/>
        <text class="bt" x="175" y="250" text-anchor="middle">shared/github-oidc/</text>
        <text class="st" x="175" y="266" text-anchor="middle">«root config» one per AWS account</text>
        <line class="sep" x1="20" y1="274" x2="330" y2="274"/>
        <text class="m" x="30" y="292">aws_iam_openid_connect_provider</text>
        <text class="m" x="30" y="308">  .github (token.actions…)</text>
        <line class="sep" x1="20" y1="318" x2="330" y2="318"/>
        <text class="m" x="30" y="336">out github_oidc_provider_arn</text>
        <text class="m" x="30" y="352">var aws_profile, allowed_account_ids</text>

        <!-- state bucket -->
        <rect class="cls-e" x="20" y="410" width="310" height="110" rx="4"/>
        <text class="bt" x="175" y="430" text-anchor="middle">S3 remote state</text>
        <text class="st" x="175" y="446" text-anchor="middle">«created by bootstrap»</text>
        <line class="sep" x1="20" y1="454" x2="330" y2="454"/>
        <text class="m" x="30" y="472">shared/github-oidc/terraform.tfstate</text>
        <text class="m" x="30" y="488">dev/backend/terraform.tfstate</text>
        <text class="m" x="30" y="504">local/ qa/ prod/ (reserved)</text>

        <!-- dev root -->
        <rect class="cls" x="380" y="20" width="350" height="230" rx="4"/>
        <text class="bt" x="555" y="40" text-anchor="middle">environments/dev/backend/</text>
        <text class="st" x="555" y="56" text-anchor="middle">«root config» state: dev/backend/</text>
        <line class="sep" x1="380" y1="64" x2="730" y2="64"/>
        <text class="m" x="390" y="82">provider aws { region, profile,</text>
        <text class="m" x="390" y="98">  allowed_account_ids = guard }</text>
        <text class="m" x="390" y="114">var ssh_allowed_cidr, key_pair_name</text>
        <text class="m" x="390" y="130">var github_repository</text>
        <line class="sep" x1="380" y1="140" x2="730" y2="140"/>
        <text class="m" x="390" y="158">module networking</text>
        <text class="m" x="390" y="174">module backend_app   (ecs-ec2-app)</text>
        <text class="m" x="390" y="190">module github_deploy (deploy-role)</text>
        <line class="sep" x1="380" y1="200" x2="730" y2="200"/>
        <text class="m" x="390" y="218">out alb_dns_name, ecr_repository_url</text>
        <text class="m" x="390" y="234">out github_environment_variables</text>

        <!-- networking -->
        <rect class="cls" x="790" y="20" width="350" height="110" rx="4"/>
        <text class="bt" x="965" y="40" text-anchor="middle">modules/networking</text>
        <text class="st" x="965" y="56" text-anchor="middle">«module» lookups only</text>
        <line class="sep" x1="790" y1="64" x2="1140" y2="64"/>
        <text class="m" x="800" y="82">in  availability_zones [1a, 1b]</text>
        <text class="m" x="800" y="98">data aws_vpc.default, aws_subnets</text>
        <text class="m" x="800" y="114">out vpc_id, subnet_ids</text>

        <!-- ecs-ec2-app -->
        <rect class="cls" x="790" y="160" width="350" height="250" rx="4"/>
        <text class="bt" x="965" y="180" text-anchor="middle">modules/ecs-ec2-app</text>
        <text class="st" x="965" y="196" text-anchor="middle">«module» 23 resources · alb ecr ecs iam secrets</text>
        <line class="sep" x1="790" y1="204" x2="1140" y2="204"/>
        <text class="m" x="800" y="222">in  app_name, vpc_id, subnet_ids</text>
        <text class="m" x="800" y="238">in  instance_type, task_cpu/memory</text>
        <text class="m" x="800" y="254">in  container_port, health_check_path</text>
        <text class="m" x="800" y="270">in  container_environment</text>
        <text class="m" x="800" y="286">in  app_secret_keys</text>
        <text class="m" x="800" y="302">in  deployment %, grace, dereg delay</text>
        <text class="m" x="800" y="318">in  key_pair_name, ssh_allowed_cidr</text>
        <line class="sep" x1="790" y1="328" x2="1140" y2="328"/>
        <text class="m" x="800" y="346">out ecr_repository_arn/url/name</text>
        <text class="m" x="800" y="362">out ecs_service_arn, cluster/service</text>
        <text class="m" x="800" y="378">out task_execution_role_arn</text>
        <text class="m" x="800" y="394">out alb_dns_name, app_secret_arn</text>

        <!-- deploy role -->
        <rect class="cls" x="790" y="440" width="350" height="140" rx="4"/>
        <text class="bt" x="965" y="460" text-anchor="middle">modules/github-deploy-role</text>
        <text class="st" x="965" y="476" text-anchor="middle">«module» 2 resources</text>
        <line class="sep" x1="790" y1="484" x2="1140" y2="484"/>
        <text class="m" x="800" y="502">in  role_name, github_repository</text>
        <text class="m" x="800" y="518">in  github_immutable_ids, environment</text>
        <text class="m" x="800" y="534">in  ecr/service ARNs, pass_role_arns</text>
        <text class="m" x="800" y="550">data aws_iam_openid_connect_provider</text>
        <text class="m" x="800" y="566">out role_arn</text>

        <!-- edges -->
        <line class="e" x1="730" y1="80" x2="787" y2="75" marker-end="url(#a4m)"/>
        <line class="e" x1="730" y1="174" x2="787" y2="250" marker-end="url(#a4m)"/>
        <line class="e" x1="730" y1="190" x2="787" y2="500" marker-end="url(#a4m)"/>
        <text class="lbl" x="760" y="140" text-anchor="middle">calls</text>
        <line class="e" x1="965" y1="130" x2="965" y2="157" marker-end="url(#a4m)"/>
        <text class="lbl" x="973" y="148">vpc_id, subnet_ids</text>
        <line class="e" x1="965" y1="410" x2="965" y2="437" marker-end="url(#a4m)"/>
        <text class="lbl" x="973" y="428">ARNs</text>
        <line class="e-prov" x1="790" y1="550" x2="333" y2="330" marker-end="url(#a4p)"/>
        <text class="lbl" x="540" y="368" text-anchor="end">looks up provider</text>
        <line class="e-prov" x1="175" y1="360" x2="175" y2="407" marker-end="url(#a4p)"/>
        <text class="lbl" x="183" y="390">state</text>
        <polyline class="e-prov" points="555,250 555,465 333,465" marker-end="url(#a4p)"/>
        <text class="lbl" x="563" y="300">state</text>
      </svg>
