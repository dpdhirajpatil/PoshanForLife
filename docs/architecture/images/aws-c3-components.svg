        <line class="e-prov" x1="560" y1="550" x2="430" y2="487" marker-end="url(#a3p)"/>
        <text class="lbl" x="520" y="516">subnets</text>
        <line class="e" x1="830" y1="344" x2="830" y2="407" marker-end="url(#a3m)"/>
        <text class="lbl" x="838" y="380">execution role</text>
        <line class="e-warn" x1="830" y1="484" x2="830" y2="547" marker-end="url(#a3w)"/>
        <text class="lbl warn" x="838" y="520">reads</text>
        <line class="e" x1="930" y1="282" x2="1000" y2="207" marker-end="url(#a3m)"/>
        <text class="lbl" x="948" y="232">image</text>
        <line class="e" x1="930" y1="332" x2="1000" y2="407" marker-end="url(#a3m)"/>
        <text class="lbl" x="976" y="368" text-anchor="end">logs</text>
        <line class="e-acc" x1="1045" y1="270" x2="1045" y2="207" marker-end="url(#a3a)"/>
