<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" style="color:#1b2330" viewBox="0 0 1160 700" role="img" aria-label="C2: inside the AWS account are the Terraform state bucket, the GitHub OIDC trust, the image registry, the load balancer, the network, the runtime IAM roles, the container platform, secrets and logs. The operator reads and writes state and applies Terraform; GitHub Actions assumes the deploy role, pushes images and updates the service; clients reach the load balancer, which forwards to the container platform; the platform pulls images, receives secrets, writes logs and reaches Supabase and the SaaS APIs.">
<style>
text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
text { fill: #1b2330; font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.bt { font-weight: 600; font-size: 13.5px; }
.sub { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.lbl { fill: #5a6575; font-size: 11.5px; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.lbl.acc { fill: #2c5aa0; }
.lbl.warn { fill: #9a6200; }
.lbl.bad { fill: #b03a3a; }
.zl { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; letter-spacing: 0.04em; }
.box { fill: #ffffff; stroke: #c6cfdb; stroke-width: 1.3; }
.box-acc { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.box-ok { fill: #e1f2e7; stroke: #2b7a4b; stroke-width: 1.3; }
.box-warn { fill: #f8edd8; stroke: #9a6200; stroke-width: 1.3; }
.box-ghost { fill: none; stroke: #5a6575; stroke-width: 1.2; stroke-dasharray: 5 4; }
.zone-aws { fill: #edf2f9; stroke: #c6cfdb; }
.zone-sb { fill: #eef5f0; stroke: #c6cfdb; }
.frame { fill: none; stroke: #5a6575; stroke-dasharray: 6 4; stroke-width: 1.1; }
.e { fill: none; stroke: #1b2330; stroke-width: 1.5; }
.e-acc { fill: none; stroke: #2c5aa0; stroke-width: 1.7; }
.e-warn { fill: none; stroke: #9a6200; stroke-width: 1.5; stroke-dasharray: 5 3; }
.e-prov { fill: none; stroke: #5a6575; stroke-width: 1.6; stroke-dasharray: 2 3; }
.e-bad { fill: none; stroke: #b03a3a; stroke-width: 1.5; stroke-dasharray: 5 3; }
.ret { stroke-dasharray: 5 4; }
.life { stroke: #c6cfdb; stroke-width: 1.2; stroke-dasharray: 4 4; }
.mk { fill: #1b2330; }
.mk-acc { fill: #2c5aa0; }
.mk-warn { fill: #9a6200; }
.mk-prov { fill: #5a6575; }
.mk-bad { fill: #b03a3a; }
.axis { stroke: #5a6575; stroke-width: 1.2; }
.band { fill: #f8edd8; stroke: #9a6200; stroke-width: 1; }
.dot { fill: #ffffff; stroke: #1b2330; stroke-width: 1.5; }
.dot-acc { fill: #2c5aa0; stroke: #2c5aa0; }
.bracket { fill: none; stroke: #2b7a4b; stroke-width: 1.5; }
.person { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.5; }
.sys { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 2.4; }
.comp { fill: #e4ecf8; stroke: #2c5aa0; stroke-width: 1.3; }
.ext { fill: #eef5f0; stroke: #5a6575; stroke-width: 1.2; }
.ext-g { fill: #f3f5f8; stroke: #5a6575; stroke-width: 1.2; }
.bnd { fill: none; stroke: #2c5aa0; stroke-width: 1.4; stroke-dasharray: 8 5; }
.node { fill: none; stroke: #5a6575; stroke-width: 1.3; }
.node-f { fill: #edf2f9; stroke: #5a6575; stroke-width: 1.3; }
.cls { fill: #ffffff; stroke: #1b2330; stroke-width: 1.2; }
.cls-e { fill: #eef5f0; stroke: #1b2330; stroke-width: 1.2; }
.sep { stroke: #c6cfdb; stroke-width: 1.2; }
.st { fill: #5a6575; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 9.6px; }
.m { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 10.2px; fill: #1b2330; }
.bus { stroke: #5a6575; stroke-width: 1.4; fill: none; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
        <defs>
          <marker id="a2m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
          <marker id="a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-acc"/></marker>
          <marker id="a2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-prov"/></marker>
          <marker id="a2w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-warn"/></marker>
        </defs>
        <circle class="person" cx="150" cy="24" r="13"/>
        <rect class="person" x="40" y="38" width="220" height="64" rx="14"/>
        <text class="bt" x="150" y="62" text-anchor="middle">Developer / operator</text>
        <text class="sub" x="150" y="80" text-anchor="middle">[Person] Terraform · env-power</text>
        <rect class="ext" x="400" y="30" width="240" height="80" rx="8"/>
        <text class="bt" x="520" y="56" text-anchor="middle">GitHub Actions</text>
        <text class="sub" x="520" y="74" text-anchor="middle">[Container: workflow]</text>
        <text class="sub" x="520" y="90" text-anchor="middle">backend-deploy-dev.yml</text>
        <rect class="ext" x="880" y="30" width="240" height="80" rx="8"/>
        <text class="bt" x="1000" y="56" text-anchor="middle">Client apps</text>
        <text class="sub" x="1000" y="74" text-anchor="middle">[Containers: web, Android, iOS]</text>
        <text class="sub" x="1000" y="90" text-anchor="middle">HTTP :80 (HTTPS pending)</text>

        <rect class="bnd" x="20" y="150" width="1120" height="440" rx="12"/>
        <text class="zl" x="36" y="172">AWS ACCOUNT 046369253799 · ap-south-1 (MUMBAI)</text>

        <rect class="comp" x="40" y="190" width="220" height="90" rx="8"/>
        <text class="bt" x="150" y="216" text-anchor="middle">Terraform state</text>
        <text class="sub" x="150" y="234" text-anchor="middle">[Container: S3 bucket]</text>
        <text class="sub" x="150" y="250" text-anchor="middle">poshan-backend-terraform-state</text>
        <text class="sub" x="150" y="266" text-anchor="middle">versioned · encrypted · private</text>
        <rect class="comp" x="300" y="190" width="240" height="90" rx="8"/>
        <text class="bt" x="420" y="216" text-anchor="middle">GitHub OIDC trust</text>
        <text class="sub" x="420" y="234" text-anchor="middle">[Container: IAM OIDC + role]</text>
        <text class="sub" x="420" y="250" text-anchor="middle">…-dev-github-deploy role</text>
        <text class="sub" x="420" y="266" text-anchor="middle">least privilege · env dev</text>
        <rect class="comp" x="580" y="190" width="200" height="90" rx="8"/>
        <text class="bt" x="680" y="216" text-anchor="middle">Image registry</text>
        <text class="sub" x="680" y="234" text-anchor="middle">[Container: ECR]</text>
        <text class="sub" x="680" y="250" text-anchor="middle">poshan-backend-dev</text>
        <text class="sub" x="680" y="266" text-anchor="middle">keeps last 10 images</text>
        <rect class="comp" x="880" y="190" width="240" height="90" rx="8"/>
        <text class="bt" x="1000" y="216" text-anchor="middle">Load balancer</text>
        <text class="sub" x="1000" y="234" text-anchor="middle">[Container: ALB]</text>
        <text class="sub" x="1000" y="250" text-anchor="middle">listener :80 · 2 AZs</text>
        <text class="sub" x="1000" y="266" text-anchor="middle">health /api/v1/health</text>

        <rect class="comp" x="40" y="330" width="220" height="130" rx="8"/>
        <text class="bt" x="150" y="356" text-anchor="middle">Network</text>
        <text class="sub" x="150" y="374" text-anchor="middle">[Container: default VPC]</text>
        <text class="sub" x="150" y="392" text-anchor="middle">public subnets 1a + 1b</text>
        <text class="sub" x="150" y="408" text-anchor="middle">2 security groups</text>
        <text class="sub" x="150" y="424" text-anchor="middle">hosts the ALB and EC2</text>
        <text class="sub" x="150" y="440" text-anchor="middle">no NAT gateway</text>
        <rect class="comp" x="300" y="330" width="240" height="130" rx="8"/>
        <text class="bt" x="420" y="356" text-anchor="middle">Runtime IAM roles</text>
        <text class="sub" x="420" y="374" text-anchor="middle">[Container: IAM]</text>
        <text class="sub" x="420" y="392" text-anchor="middle">instance role (ECS, SSM)</text>
        <text class="sub" x="420" y="408" text-anchor="middle">task execution role</text>
        <text class="sub" x="420" y="424" text-anchor="middle">ECR pull · logs · secrets</text>
        <rect class="sys" x="580" y="330" width="540" height="130" rx="8"/>
        <text class="bt" x="850" y="358" text-anchor="middle">Container platform</text>
        <text class="sub" x="850" y="378" text-anchor="middle">[Container: ECS on EC2 · Auto Scaling group 0..1]</text>
        <text class="sub" x="850" y="396" text-anchor="middle">t3.micro (ECS-optimized AL2023) → Docker → Spring Boot API</text>
        <text class="sub" x="850" y="414" text-anchor="middle">task def rev 3 · 700 MB · stop-then-start deploys</text>
        <text class="sub" x="850" y="432" text-anchor="middle">scaled 0 ↔ 1 by env-power.sh</text>

        <rect class="comp" x="580" y="500" width="230" height="70" rx="8"/>
        <text class="bt" x="695" y="524" text-anchor="middle">Secrets</text>
        <text class="sub" x="695" y="542" text-anchor="middle">[Container: Secrets Manager]</text>
        <text class="sub" x="695" y="558" text-anchor="middle">poshan-backend-dev/app</text>
        <rect class="comp" x="880" y="500" width="240" height="70" rx="8"/>
        <text class="bt" x="1000" y="524" text-anchor="middle">Logs</text>
        <text class="sub" x="1000" y="542" text-anchor="middle">[Container: CloudWatch Logs]</text>
        <text class="sub" x="1000" y="558" text-anchor="middle">/ecs/poshan-backend-dev · 14 d</text>

        <rect class="ext" x="560" y="620" width="560" height="62" rx="8"/>
        <text class="bt" x="840" y="646" text-anchor="middle">Supabase (Postgres, Storage) · Firebase · MSG91 · Anthropic</text>
        <text class="sub" x="840" y="666" text-anchor="middle">[External systems]</text>

        <line class="e-prov" x1="150" y1="102" x2="150" y2="187" marker-end="url(#a2p)"/>
