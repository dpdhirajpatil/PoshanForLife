        <line class="e-acc" x1="460" y1="110" x2="430" y2="187" marker-end="url(#a2a)"/>
        <text class="lbl acc" x="440" y="150" text-anchor="end">assume role</text>
        <line class="e-acc" x1="560" y1="110" x2="660" y2="187" marker-end="url(#a2a)"/>
        <text class="lbl acc" x="622" y="146">push image</text>
        <polyline class="e-acc" points="640,70 840,70 840,327" marker-end="url(#a2a)"/>
        <text class="lbl acc" x="848" y="130">update service</text>
        <line class="e" x1="1000" y1="110" x2="1000" y2="187" marker-end="url(#a2m)"/>
        <text class="lbl" x="1008" y="152">HTTP :80</text>
        <line class="e" x1="1000" y1="280" x2="1000" y2="327" marker-end="url(#a2m)"/>
        <text class="lbl" x="1008" y="308">forward</text>
        <line class="e" x1="680" y1="280" x2="680" y2="327" marker-end="url(#a2m)"/>
        <text class="lbl" x="688" y="308">pull</text>
        <line class="e" x1="540" y1="395" x2="577" y2="395" marker-end="url(#a2m)"/>
        <line class="e-warn" x1="695" y1="500" x2="695" y2="463" marker-end="url(#a2w)"/>
        <text class="lbl warn" x="703" y="488">inject at start</text>
        <line class="e" x1="1000" y1="460" x2="1000" y2="497" marker-end="url(#a2m)"/>
        <text class="lbl" x="1008" y="484">awslogs</text>
