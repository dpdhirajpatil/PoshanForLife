# Build the backend image, push it to the dev ECR repo, and roll the dev ECS
# service onto it. Replaces the Jenkins pipeline.
#
# AWS auth is OIDC (no stored keys): the job assumes the role created by
# .iac/environments/dev/backend (module github_deploy), which trusts only this
# repo's "dev" GitHub Environment.
#
# One-time setup: after applying .iac/environments/dev/backend, copy its
# `github_environment_variables` output into
# GitHub -> Settings -> Environments -> dev -> Variables.
# Until AWS_DEPLOY_ROLE_ARN is set there, the deploy job is skipped, not failed.

name: Backend deploy (dev)

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write # for the OIDC token exchanged for AWS credentials
  contents: read

concurrency:
  group: backend-deploy-dev
  cancel-in-progress: false # never cut off a deploy mid-rollout

jobs:
  # Environment-scoped variables aren't visible to a job-level `if`, so a
  # tiny job inside the environment reports whether deploy config exists.
  config:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dev deploy skipped: AWS_DEPLOY_ROLE_ARN not set on the 'dev' environment yet (see .iac/README.md)."
          fi

  deploy:
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json

      - id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15
