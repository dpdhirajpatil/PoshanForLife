# XcodeGen spec — generates PoshanForLife.xcodeproj from this directory tree.
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# The .xcodeproj is deliberately NOT committed: it's a generated artifact whose
# pbxproj format merge-conflicts on every parallel branch. This file is the
# source of truth; regenerate after adding files.

name: PoshanForLife

options:
  bundleIdPrefix: com.poshanforlife
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

targets:
  PoshanForLife:
    type: application
    platform: iOS
    sources:
      - path: PoshanForLife
        excludes:
          # Referenced through INFOPLIST_FILE in the xcconfigs; listing them as
          # sources would also copy them into the bundle as stray resources.
          - "Info-Debug.plist"
          - "Info-Release.plist"
          - "**/.gitkeep"
    # Per-configuration xcconfigs carry the base URLs and the Debug-only ATS
    # exception. See Config/Debug.xcconfig for why ATS must be split by file
    # rather than gated with a compile-time flag.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

  # Drives the real app on a Simulator. The only way to script taps and typing
  # from the command line — simctl has no touch injection, and AppleScript
  # keystrokes need an Accessibility grant the CLI doesn't have.
  PoshanForLifeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PoshanForLifeUITests
    dependencies:
      - target: PoshanForLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poshanforlife.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PoshanForLife

schemes:
  PoshanForLife:
    build:
      targets:
        PoshanForLife: all
        PoshanForLifeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PoshanForLifeUITests
    archive:
      config: Release
