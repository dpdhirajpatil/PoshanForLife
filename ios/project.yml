# XcodeGen spec — generates PoshanForLife.xcodeproj from this directory tree.
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# The .xcodeproj is deliberately NOT committed: it's a generated artifact whose
# pbxproj format merge-conflicts on every parallel branch. This file is the
# source of truth; regenerate after adding files.

name: PoshanForLife

options:
  bundleIdPrefix: com.poshanforlife
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

# The one deliberate exception to "zero third-party dependencies" (see
# README) — IOS-08 needs push, and there is no first-party path to APNs
# registration + token management that doesn't reinvent what FirebaseMessaging
# already does, on a backend that already speaks FCM for Android. Pinned to a
# major version rather than `from: 10.0.0` floor-only, so a new major release
# can't silently change behavior on the next `xcodegen generate`.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 10.29.0

targets:
  PoshanForLife:
    type: application
    platform: iOS
    sources:
      - path: PoshanForLife
        excludes:
          # Referenced through INFOPLIST_FILE in the xcconfigs; listing them as
          # sources would also copy them into the bundle as stray resources.
          - "Info-Debug.plist"
          - "Info-Release.plist"
          - "**/.gitkeep"
    # Per-configuration xcconfigs carry the base URLs and the Debug-only ATS
    # exception. See Config/Debug.xcconfig for why ATS must be split by file
    # rather than gated with a compile-time flag.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    # XcodeGen generates and OWNS this file from `properties` below on every
    # `xcodegen generate` — hand-editing PoshanForLife.entitlements directly
    # gets silently overwritten (learned by trying it: a hand-authored
    # aps-environment key was stomped back to an empty <dict/> the moment
    # `generate` ran again), same reason Info.plist's GENERATE_INFOPLIST_FILE
    # sibling pattern exists elsewhere in this project.
    entitlements:
      path: PoshanForLife/PoshanForLife.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        # IOS-11: read-only HealthKit sync. Xcode's "HealthKit" capability
        # toggle in Signing & Capabilities is UI sugar for exactly this key —
        # setting it here is equivalent and survives `xcodegen generate`.
        com.apple.developer.healthkit: true
    dependencies:
      - package: Firebase
        product: FirebaseMessaging

  # Drives the real app on a Simulator. The only way to script taps and typing
  # from the command line — simctl has no touch injection, and AppleScript
  # keystrokes need an Accessibility grant the CLI doesn't have.
  PoshanForLifeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PoshanForLifeUITests
    dependencies:
      - target: PoshanForLife
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poshanforlife.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PoshanForLife

schemes:
  PoshanForLife:
    build:
      targets:
        PoshanForLife: all
        PoshanForLifeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PoshanForLifeUITests
    archive:
      config: Release
