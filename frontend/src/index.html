<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Poppins substitutes for the brand's licensed "Gilroy" (display/body);
    Alex Brush substitutes for the licensed "Alexander Lettering" script
    accent. Swapping in the real files later only means changing this link
    and the --font-display/--font-body/--font-accent declarations in
    styles.scss — no component references "Poppins"/"Gilroy" by name.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Alex+Brush&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Applies the persisted/system theme class synchronously, before Angular
    // renders, to avoid a flash of the wrong theme (mirrors next-themes).
    (function () {
      try {
        var stored = localStorage.getItem('theme') || 'system';
        var isDark =
          stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      } catch (e) {
        /* localStorage/matchMedia unavailable — fall back to light */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
